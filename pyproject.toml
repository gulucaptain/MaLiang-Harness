[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maliang-harness"
version = "0.1.0"
description = "Pluggable visual creation harness built on Deep Agents"
requires-python = ">=3.11"
dependencies = [
  "deepagents==0.7.15",
  "langchain-openai>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3",
  "pillow>=11,<13",
  "av==15.1.0",
  "playwright==1.58.0",
  "filelock>=3.18,<4",
  "openai>=2,<3",
  "httpx[socks]>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
maliang-harness = "maliang.cli:main"
maliang = "maliang.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maliang"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
pythonpath = [".", "src"]
markers = ["rendering: requires Chromium and PyAV"]

[tool.ruff]
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
